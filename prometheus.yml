global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "url-shortener-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: "url-shortener-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]
  - job_name: "url-shortener-abuse-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["abuse-worker:8003"]
