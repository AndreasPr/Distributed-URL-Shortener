# Opt-in: one free web service and one private, ephemeral free Key Value instance.
services:
  - type: web
    name: relaymark-api
    runtime: docker
    plan: free
    region: virginia # Supabase us-east-1 (North Virginia)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.hosted
    healthCheckPath: /livez
    autoDeployTrigger: "off" # CI-gated deploy hook in deploy-check.yml; avoids a check/deploy cycle.
    envVars:
      - key: APP_ROLE
        value: all
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: EVENT_BUS
        value: redis_streams
      - key: LLM_PROVIDER
        value: fake
      - key: LLM_DAILY_BUDGET
        value: '0'
      - key: OTEL_SDK_DISABLED
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: relaymark-keyvalue
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PRODUCT_HOSTS
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_HOSTNAMES
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
  - type: keyvalue
    name: relaymark-keyvalue
    plan: free
    region: virginia
    ipAllowList: [] # No external connections; same-workspace private network only.
    maxmemoryPolicy: noeviction
    persistenceMode: "off" # Free instances lose all data on restart.
