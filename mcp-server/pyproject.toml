[project]
name = "distributed-url-shortener-mcp"
version = "0.1.0"
description = "MCP server for abuse detection and reporting in the distributed URL shortener."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "mcp==1.28.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
python_files = ["test_*.py"]
