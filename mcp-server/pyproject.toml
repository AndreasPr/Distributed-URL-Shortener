[project]
name = "distributed-url-shortener-mcp"
version = "0.1.0"
description = "MCP server for abuse detection and reporting in the distributed URL shortener."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "mcp",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
python_files = ["test_*.py"]
