name: CI - Tests & Code Quality

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      # Tests use in-memory SQLite and mocked external sources; no cloud
      # credentials or live PostgreSQL/Redis/Kafka services are required.
      - name: Blocking backend quality gate
        run: make check
      - name: MCP tests
        run: make mcp-test
      - name: PostgreSQL and Redis integration coverage gate
        run: make test-integration
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend-combined
          name: codecov-umbrella
          fail_ci_if_error: false

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-check
