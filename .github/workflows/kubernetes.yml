name: Kubernetes kind smoke
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned local-cluster tools
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0
      - name: Validate, build SHA image, deploy, and smoke test
        run: bash scripts/kind_smoke.sh
