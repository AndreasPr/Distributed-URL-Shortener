name: CD - Build & Push to Registry

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_run:
    workflows: ['CI - Tests & Code Quality']
    types: [completed]
    branches: [master, main]

# NOTE: This workflow builds and pushes Docker images to GitHub Container Registry (GHCR).
# Kubernetes deployment is NOT automated here because the kubeconfig points to local Docker Desktop
# (127.0.0.1:6443) which is not accessible from GitHub Actions cloud runners.
#
# For local Kubernetes deployment: ./k8s/deploy-simple.sh
# For cloud K8s deployment (EKS/GKE/AKS): 
#   1. Update KUBE_CONFIG secret to point to your cloud cluster
#   2. Create the deploy-to-k8s job below 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_version: ${{ steps.version.outputs.version }}
      image_repository: ${{ steps.repository.outputs.image_repository }}
      build_date: ${{ steps.build_date.outputs.build_date }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="main-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Image version: ${VERSION}"

      - name: Normalize image repository
        id: repository
        run: |
          IMAGE_REPOSITORY="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=${IMAGE_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "Image repository: ${IMAGE_REPOSITORY}"

      - name: Generate build date
        id: build_date
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "Build date: ${BUILD_DATE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ steps.repository.outputs.image_repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.repository.outputs.image_repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.repository.outputs.image_repository }}:buildcache,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.build_date }}
            VCS_REF=${{ github.sha }}
