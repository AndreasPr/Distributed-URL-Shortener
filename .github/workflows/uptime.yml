name: Hosted health backup monitor
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-health-monitor
  cancel-in-progress: true
jobs:
  health:
    if: vars.UPTIME_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: One dependency-aware health request
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: python3 scripts/hosted_monitor.py health
