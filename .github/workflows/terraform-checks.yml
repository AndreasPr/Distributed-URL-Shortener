name: Terraform checks
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'Makefile'
      - '.github/workflows/terraform-checks.yml'
      - 'tests/test_terraform_design.py'
  push:
    branches: [master, main]
    paths:
      - 'infra/**'
      - 'Makefile'
      - '.github/workflows/terraform-checks.yml'
      - 'tests/test_terraform_design.py'
permissions:
  contents: read
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_EC2_METADATA_DISABLED: 'true'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4
        with:
          tflint_version: v0.65.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - name: Install isolated static scanner
        run: |
          python -m venv /tmp/terraform-checks
          /tmp/terraform-checks/bin/pip install checkov==3.3.30
      - run: make tf-fmt
      - run: make tf-validate
      - run: make tf-lint
      - run: make tf-sec CHECKOV=/tmp/terraform-checks/bin/checkov
