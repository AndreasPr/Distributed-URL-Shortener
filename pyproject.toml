[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

# These dependencies do not publish usable typing metadata. Restrict missing-import
# suppression to those libraries; application errors remain blocking.
[[tool.mypy.overrides]]
module = ["kafka.*", "opentelemetry.exporter.jaeger.thrift.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.coverage.report]
# Measured default unit + PostgreSQL/Redis suite: 93.6446%; rounded down.
# Unit-only make test explicitly disables this combined-suite floor.
fail_under = 93.6
precision = 2
