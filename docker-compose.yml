services:
  api: &api
    profiles: [kafka]
    build: .
    command: uvicorn app.main:app --no-proxy-headers --host 0.0.0.0 --port 8000
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment: &api_environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-16384}
      WRITE_RATE_CAPACITY: ${WRITE_RATE_CAPACITY:-20}
      WRITE_RATE_REFILL: ${WRITE_RATE_REFILL:-1}
      REDIRECT_RATE_CAPACITY: ${REDIRECT_RATE_CAPACITY:-120}
      REDIRECT_RATE_REFILL: ${REDIRECT_RATE_REFILL:-10}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      EVENT_BUS: kafka
      EVENT_TOPIC: ${EVENT_TOPIC:-url-events}
      ABUSE_TOPIC: ${ABUSE_TOPIC:-url-created}
      ABUSE_GROUP: ${ABUSE_GROUP:-abuse-group}
      ABUSE_DLQ_TOPIC: ${ABUSE_DLQ_TOPIC:-abuse-dlq}
      EVENT_DLQ_TOPIC: ${EVENT_DLQ_TOPIC:-url-events-dlq}
      EVENT_CONSUMER_GROUP: ${EVENT_CONSUMER_GROUP:-analytics-group}
      EVENT_BATCH_SIZE: ${EVENT_BATCH_SIZE:-100}
      EVENT_FLUSH_INTERVAL: ${EVENT_FLUSH_INTERVAL:-5}
      EVENT_PUBLISH_ATTEMPTS: ${EVENT_PUBLISH_ATTEMPTS:-60}
      EVENT_QUEUE_SIZE: ${EVENT_QUEUE_SIZE:-1000}
      DB_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

  migrate:
    build: .
    healthcheck:
      disable: true
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"

  prometheus:
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=35d"]
    image: prom/prometheus:v3.15.0
    restart: on-failure
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: on-failure
    ports:
      - "6831:6831/udp"  # Jaeger agent compact thrift
      - "6832:6832/udp"  # Jaeger agent compact thrift
      - "5778:5778"      # Jaeger agent HTTP
      - "127.0.0.1:4318:4318" # OTLP/HTTP for host-run processes
      - "16686:16686"    # Jaeger UI
      - "14268:14268"    # Jaeger collector HTTP (for /api/traces)
    environment:
      SPAN_STORAGE_TYPE: memory
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:13.2.4
    restart: on-failure
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  worker: &worker
    stop_grace_period: 120s
    profiles: [kafka]
    build: .
    healthcheck:
      disable: true
    command: python -m app.workers.analytics_worker
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment: *api_environment

  api-redis:
    <<: *api
    profiles: [redis-streams]
    depends_on: &redis_dependencies
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment: &redis_environment
      <<: *api_environment
      EVENT_BUS: redis_streams
    networks:
      default:
        aliases: [api]

  worker-redis:
    <<: *worker
    profiles: [redis-streams]
    depends_on: *redis_dependencies
    environment: *redis_environment
    networks:
      default:
        aliases: [worker]

  abuse-worker:
    <<: *worker
    command: python -m app.workers.abuse_worker
    environment: &abuse_environment
      <<: *api_environment
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MIN_INTERVAL_SECONDS: ${GEMINI_MIN_INTERVAL_SECONDS:-5}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-100}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_BACKOFF_SECONDS: ${LLM_BACKOFF_SECONDS:-0.25}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-512}
      ABUSE_GRAY_LOW: ${ABUSE_GRAY_LOW:-0.15}
      ABUSE_GRAY_HIGH: ${ABUSE_GRAY_HIGH:-0.65}
      ABUSE_VERDICT_TTL: ${ABUSE_VERDICT_TTL:-3600}
      ABUSE_LLM_INPUT_LIMIT: ${ABUSE_LLM_INPUT_LIMIT:-512}
      ABUSE_METRICS_PORT: 8003

  abuse-worker-redis:
    <<: *worker
    profiles: [redis-streams]
    command: python -m app.workers.abuse_worker
    depends_on: *redis_dependencies
    environment:
      <<: *abuse_environment
      EVENT_BUS: redis_streams
    networks:
      default:
        aliases: [abuse-worker]

  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7.4.9-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  zookeeper:
    profiles: [kafka]
    image: confluentinc/cp-zookeeper:7.9.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    profiles: [kafka]
    image: confluentinc/cp-kafka:8.3.0
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

volumes:
  prometheus_data:
  postgres_data:
  redis_data:
  grafana_data:
