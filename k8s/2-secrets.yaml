apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
  namespace: url-shortener
type: Opaque
stringData:
  # Database credentials
  DB_PASSWORD: postgres_password_k8s
  
  # Redis auth (optional, empty means no auth)
  REDIS_PASSWORD: ""
  
  # Grafana admin
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: admin_password_k8s
  
  # Optional: Sentry DSN for error tracking (leave empty if not using)
  SENTRY_DSN: ""
