apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: url-shortener
  newTag: 9d639b73f980731d1073b90ced0276dda46b31d8
patches:
- target:
    kind: ConfigMap
    name: url-shortener-config
  patch: "apiVersion: v1\ndata:\n  CORS_ORIGINS: http://localhost:3000\n  EVENT_BUS:\
    \ redis_streams\n  EVENT_FLUSH_INTERVAL: '1'\nkind: ConfigMap\nmetadata:\n  name:\
    \ url-shortener-config\n"
- target:
    kind: Deployment
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/template/spec/containers/0/resources/requests\n  value: {cpu: 50m, memory:\
    \ 64Mi}\n"
- target:
    kind: StatefulSet
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/template/spec/containers/0/resources/requests\n  value: {cpu: 50m, memory:\
    \ 64Mi}\n"
