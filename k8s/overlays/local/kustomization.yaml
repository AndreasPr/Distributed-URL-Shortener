apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- kafka.yaml
- ingress.yaml
- hpa.yaml
images:
- name: url-shortener
  newTag: 0c6b86053e7bb97d858dd3b779bbcf23d05db6a5
patches:
- target:
    kind: ConfigMap
    name: url-shortener-config
  patch: "apiVersion: v1\ndata:\n  CORS_ORIGINS: http://localhost:3000\n  EVENT_BUS:\
    \ kafka\n  EVENT_FLUSH_INTERVAL: '1'\nkind: ConfigMap\nmetadata:\n  name: url-shortener-config\n"
