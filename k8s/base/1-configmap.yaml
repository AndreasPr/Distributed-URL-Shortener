apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-config
  namespace: url-shortener
data:
  CORS_ORIGINS: https://shortener.example.com
  DB_NAME: url_db
  DB_HOST: postgres.url-shortener.svc.cluster.local
  DB_PORT: '5432'
  REDIS_HOST: redis.url-shortener.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  KAFKA_BOOTSTRAP_SERVERS: kafka.url-shortener.svc.cluster.local:9092
  EVENT_BUS: kafka
  EVENT_TOPIC: url-events
  EVENT_DLQ_TOPIC: url-events-dlq
  EVENT_CONSUMER_GROUP: analytics-group
  EVENT_BATCH_SIZE: '100'
  EVENT_FLUSH_INTERVAL: '5'
  EVENT_QUEUE_SIZE: '1000'
  API_HOST: 0.0.0.0
  API_PORT: '8000'
  LOG_LEVEL: INFO
  PROMETHEUS_HOST: prometheus.url-shortener.svc.cluster.local
  PROMETHEUS_PORT: '9090'
  WRITE_RATE_CAPACITY: '20'
  WRITE_RATE_REFILL: '1'
  REDIRECT_RATE_CAPACITY: '120'
  REDIRECT_RATE_REFILL: '10'
  TRUSTED_PROXIES: ''
