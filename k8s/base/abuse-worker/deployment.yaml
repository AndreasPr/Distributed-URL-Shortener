apiVersion: apps/v1
kind: Deployment
metadata:
  name: abuse-worker
  namespace: url-shortener
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: abuse-worker
  template:
    metadata:
      labels:
        app: abuse-worker
    spec:
      terminationGracePeriodSeconds: 120
      initContainers:
      - name: wait-postgres
        image: busybox:1.38.0
        command:
        - sh
        - -c
        - until nc -z postgres.url-shortener.svc.cluster.local 5432; do sleep 2; done
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: abuse-worker
        image: url-shortener:source
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.workers.abuse_worker
        ports:
        - name: metrics
          containerPort: 8003
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: REDIS_PORT
        - name: REDIS_URL
          value: redis://$(REDIS_HOST):$(REDIS_PORT)/0
        - name: LLM_PROVIDER
          value: fake
        - name: ABUSE_METRICS_PORT
          value: '8003'
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: DB_NAME
        - name: DB_URL
          value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
        - name: EVENT_BUS
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: EVENT_BUS
        - name: EVENT_TOPIC
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: EVENT_TOPIC
        - name: EVENT_DLQ_TOPIC
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: EVENT_DLQ_TOPIC
        - name: EVENT_CONSUMER_GROUP
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: EVENT_CONSUMER_GROUP
        - name: EVENT_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: EVENT_BATCH_SIZE
        - name: EVENT_FLUSH_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: EVENT_FLUSH_INTERVAL
        - name: EVENT_QUEUE_SIZE
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: EVENT_QUEUE_SIZE
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: LOG_LEVEL
          value: INFO
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://jaeger:4318
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 512Mi
            cpu: 500m
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: abuse-worker
  namespace: url-shortener
spec:
  selector:
    app: abuse-worker
  ports:
  - name: metrics
    port: 8003
    targetPort: metrics
  clusterIP: None
  publishNotReadyAddresses: true
