apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: url-shortener
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: url-shortener
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: abuse-worker
  namespace: url-shortener
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: abuse-worker
