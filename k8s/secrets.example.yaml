# Reference only: kubectl does NOT expand environment variables in YAML.
# Create the real Secret using --from-env-file, as documented in docs/DEPLOYMENT.md.
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
  namespace: url-shortener
type: Opaque
stringData:
  DB_USER: REPLACE_WITH_LOCAL_DB_USER
  DB_PASSWORD: REPLACE_WITH_LOCAL_DB_PASSWORD
  GRAFANA_ADMIN_USER: REPLACE_WITH_LOCAL_GRAFANA_USER
  GRAFANA_ADMIN_PASSWORD: REPLACE_WITH_LOCAL_GRAFANA_PASSWORD
