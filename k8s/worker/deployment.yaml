apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: url-shortener
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
      - name: wait-postgres
        image: busybox:latest
        command:
          - sh
          - -c
          - until nc -z postgres.url-shortener.svc.cluster.local 5432; do sleep 2; done
      containers:
      - name: worker
        image: url-shortener:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.workers.analytics_worker"]
        env:
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: DB_NAME
        - name: DB_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always
