<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Local system architecture</title><desc id="desc">Frontend and MCP call the API. API uses Redis and PostgreSQL and publishes to Kafka or Redis Streams. Analytics and abuse workers consume events. Abuse uses heuristics and optional LLMs. Prometheus, Grafana and Jaeger observe the services.</desc><rect width="960" height="270" rx="16" fill="#0f172a"/><g fill="#e2e8f0" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="110" y="65">Frontend / MCP</text><text x="320" y="65">API</text><text x="570" y="45">Redis cache</text><text x="800" y="45">PostgreSQL</text><text x="320" y="145">Kafka / Redis Streams</text><text x="620" y="125">Analytics worker → PostgreSQL</text><text x="620" y="175">Abuse worker → heuristics / LLM</text><text x="480" y="240" fill="#67e8f9">Telemetry: Prometheus → Grafana · OpenTelemetry → Jaeger</text></g><g stroke="#67e8f9" stroke-width="2" fill="none"><path d="M200 60H285m65-5 150-15m-150 20 380-5M320 80v40m110 20h40m-40 0 40 30"/></g></svg>
